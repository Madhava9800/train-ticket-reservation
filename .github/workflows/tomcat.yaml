name: CI/CD Pipeline to Deploy to Tomcat

on:
  push:
    branches:
      - master

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3️⃣ Build with Maven
      - name: Build with Maven
        run: mvn clean package

      # 4️⃣ Verify WAR file
      - name: Verify WAR file
        run: ls -lh target/

      # 5️⃣ Check Tomcat connection
      - name: Check Tomcat connection
        run: |
          curl --fail --anyauth -u "${{ secrets.TOMCAT_USER }}:${{ secrets.TOMCAT_PASSWORD }}" \
          "http://${{ secrets.TOMCAT_HOST }}:8080/manager/text/list"

      # 6️⃣ Undeploy old application (ignore error if not exists)
      - name: Undeploy old app
        run: |
          curl -u "${{ secrets.TOMCAT_USER }}:${{ secrets.TOMCAT_PASSWORD }}" \
          "http://${{ secrets.TOMCAT_HOST }}:8080/manager/text/undeploy?path=/TrainBook" || true

      # 7️⃣ Deploy WAR to Tomcat
      - name: Deploy WAR to Tomcat
        run: |
          curl -v -u "${{ secrets.TOMCAT_USER }}:${{ secrets.TOMCAT_PASSWORD }}" \
          -T target/TrainBook-1.0.0-SNAPSHOT.war \
          "http://${{ secrets.TOMCAT_HOST }}:8080/manager/text/deploy?path=/TrainBook&update=true"

      # 8️⃣ Verify deployment
      - name: Verify Deployment
        run: |
          curl --fail -u "${{ secrets.TOMCAT_USER }}:${{ secrets.TOMCAT_PASSWORD }}" \
          "http://${{ secrets.TOMCAT_HOST }}:8080/manager/text/list"
